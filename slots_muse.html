<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lucky Slots</title>
<style>
:root{
  --bg:#020617;
  --card:#0b1220;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --text:#e2e8f0;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(1200px 800px at 70% -10%, #1e1b4b 0%, #020617 60%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
.container{
  width:min(920px,95vw);
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  text-align:center;
}
h1{
  margin:0 0 12px;
  font-size:clamp(28px,5vw,44px);
  letter-spacing:.02em;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.stats{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  margin:12px 0 20px;
  font-weight:600;
}
.stat{background:rgba(255,255,255,.06);padding:8px 14px;border-radius:12px}
.reels{
  display:flex;
  gap:16px;
  justify-content:center;
  align-items:center;
  margin:20px auto 10px;
}
.reel{
  width:110px;height:140px;
  background:var(--card);
  border:2px solid rgba(255,255,255,.12);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:64px;
  transition:transform .08s linear;
}
.reel.glow{
  animation:glow 1s ease-in-out infinite alternate;
  border-color:var(--accent2);
}
@keyframes glow{
  from{box-shadow:0 0 20px rgba(34,211,238,.4)}
  to{box-shadow:0 0 40px rgba(124,58,237,.6)}
}
.controls{margin-top:18px}
button{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#020617;
  border:none;
  padding:14px 28px;
  font-size:18px;
  font-weight:800;
  border-radius:14px;
  cursor:pointer;
  transition:transform .08s ease;
}
button:disabled{opacity:.5;cursor:not-allowed}
button:not(:disabled):active{transform:scale(.98)}
.message{
  min-height:28px;
  margin-top:14px;
  font-weight:700;
}
@media(max-width:600px){
  .reel{width:90px;height:120px;font-size:52px}
}
</style>
</head>
<body>
<main class="container" role="main" aria-label="Lucky Slots Game">
  <h1>Lucky Slots</h1>
  <div class="stats" aria-live="polite">
    <div class="stat">Credits: <span id="credits">1000</span></div>
    <div class="stat">Wins: <span id="wins">0</span></div>
    <div class="stat">Losses: <span id="losses">0</span></div>
  </div>

  <div class="reels" aria-label="Slot reels">
    <div class="reel" id="r1" aria-live="polite">🍒</div>
    <div class="reel" id="r2" aria-live="polite">🍋</div>
    <div class="reel" id="r3" aria-live="polite">🍊</div>
  </div>

  <div class="controls">
    <button id="spinBtn" aria-label="Spin reels">Spin - 100 Credits</button>
  </div>
  <div class="message" id="msg" role="status" aria-live="polite"></div>
</main>

<script>
const SYMBOLS = ['🍒','🍋','🍊','🍉','🍇','🍓','🍈','🍀','🔔','⭐','❄️','🌈'];
const reelEls = ['r1','r2','r3'].map(id=>document.getElementById(id));
const creditsEl = document.getElementById('credits');
const winsEl = document.getElementById('wins');
const lossesEl = document.getElementById('losses');
const spinBtn = document.getElementById('spinBtn');
const msgEl = document.getElementById('msg');

let credits = 1000;
let wins = 0;
let losses = 0;
let spinning = false;
let audioCtx = null;

function initAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
}
function playTone(freq, duration=0.3){
  initAudio();
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type='sine';
  osc.frequency.value=freq;
  gain.gain.value=0.15;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
  osc.stop(audioCtx.currentTime+duration);
}

function updateUI(){
  creditsEl.textContent = credits;
  winsEl.textContent = wins;
  lossesEl.textContent = losses;
  spinBtn.disabled = spinning || credits < 100;
}

function randomSymbol(){ return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]; }

spinBtn.addEventListener('click', ()=>{
  if(spinning || credits < 100) return;
  
  // Immediate credit deduction on press
  credits -= 100;
  updateUI();
  msgEl.textContent = 'Spinning...';
  
  spinning = true;
  spinBtn.disabled = true;
  reelEls.forEach(el=>el.classList.remove('glow'));

  const spinDuration = 1500;
  const intervalMs = 100;
  const steps = Math.ceil(spinDuration/intervalMs);
  let count = 0;
  const interval = setInterval(()=>{
    reelEls.forEach(el=> el.textContent = randomSymbol());
    count++;
  }, intervalMs);

  setTimeout(()=>{
    clearInterval(interval);
    const finalSymbols = reelEls.map(el=> {
      const s = randomSymbol();
      el.textContent = s;
      return s;
    });

    const [a,b,c] = finalSymbols;
    let resultMsg = '';
    if(a===b && b===c){
      credits += 1000;
      wins++; resultMsg = 'JACKPOT! 3 matching symbols +1000 credits';
      playTone(440,0.6);
    } else if(a===b || b===c || a===c){
      credits += 300;
      wins++; resultMsg = 'Win! 2 matching symbols +300 credits';
      playTone(440,0.4);
    } else {
      losses++; resultMsg = 'No match. Better luck next spin.';
      playTone(220,0.4);
    }
    msgEl.textContent = resultMsg;
    if(a===b && b===c || a===b || b===c || a===c){
      reelEls.forEach(el=>el.classList.add('glow'));
      setTimeout(()=>reelEls.forEach(el=>el.classList.remove('glow')), 2000);
    }
    spinning = false;
    updateUI();
  }, spinDuration);
});

updateUI();
</script>
</body>
</html>
