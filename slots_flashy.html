<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Slots</title>
  <style>
    :root {
      --bg-dark: #0a0a1a;
      --bg-mid: #1a1a3e;
      --accent: #ffd700;
      --win-color: #00ff88;
      --loss-color: #ff4444;
      --text: #e0e0ff;
      --card-bg: rgba(255, 255, 255, 0.05);
      --reel-bg: rgba(0, 0, 0, 0.4);
      --border: rgba(255, 215, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 70%, #000000 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 10% 80%, rgba(255,215,0,0.5), transparent),
        radial-gradient(1px 1px at 90% 10%, rgba(255,215,0,0.4), transparent),
        radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.2), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .game-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      letter-spacing: 2px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 20px;
      gap: 10px;
    }

    .stat-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      text-align: center;
      flex: 1;
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
    }

    .reels-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      perspective: 600px;
    }

    .reel {
      width: 100px;
      height: 100px;
      background: var(--reel-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      overflow: hidden;
      position: relative;
    }

    .reel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 50%, transparent 50%, rgba(0,0,0,0.2) 100%);
      border-radius: 10px;
      pointer-events: none;
      z-index: 1;
    }

    .reel.spinning {
      animation: reelShake 0.1s infinite alternate;
    }

    @keyframes reelShake {
      0% { transform: translateY(-2px); }
      100% { transform: translateY(2px); }
    }

    .reel.winner {
      animation: reelGlow 0.5s ease-in-out infinite alternate;
      border-color: var(--win-color);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4), inset 0 0 20px rgba(0, 255, 136, 0.1);
    }

    .reel.loser {
      border-color: var(--loss-color);
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
    }

    @keyframes reelGlow {
      0% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
      100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.6), inset 0 0 15px rgba(0, 255, 136, 0.15); }
    }

    .outcome-text {
      font-size: 1.1rem;
      min-height: 30px;
      margin-bottom: 15px;
      text-align: center;
      transition: color 0.3s;
    }

    .outcome-text.win {
      color: var(--win-color);
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    .outcome-text.lose {
      color: var(--loss-color);
      text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
    }

    .spin-btn {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      padding: 14px 50px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    .spin-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(255, 215, 0, 0.5);
    }

    .spin-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .spin-btn:disabled {
      background: linear-gradient(135deg, #555, #333);
      color: #888;
      cursor: not-allowed;
      box-shadow: none;
    }

    .spin-btn:focus {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .decorative-stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      color: rgba(255, 215, 0, 0.3);
      font-size: 1.5rem;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1.2); }
    }

    .result-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
    }

    .result-flash.win-flash {
      background: radial-gradient(circle, rgba(0,255,136,0.15) 0%, transparent 70%);
      animation: flashPulse 0.6s ease-out;
    }

    .result-flash.lose-flash {
      background: radial-gradient(circle, rgba(255,68,68,0.1) 0%, transparent 70%);
      animation: flashPulse 0.6s ease-out;
    }

    @keyframes flashPulse {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 1.8rem;
      }

      .reel {
        width: 80px;
        height: 80px;
        font-size: 2.2rem;
      }

      .reels-container {
        gap: 8px;
      }

      .stat-item {
        padding: 8px 12px;
      }

      .stat-value {
        font-size: 1.1rem;
      }

      .spin-btn {
        padding: 12px 35px;
        font-size: 1rem;
      }
    }

    @media (max-width: 350px) {
      .reel {
        width: 65px;
        height: 65px;
        font-size: 1.8rem;
      }

      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="decorative-stars" aria-hidden="true">
    <span class="star" style="top:5%;left:10%;animation-delay:0s;">✦</span>
    <span class="star" style="top:15%;left:75%;animation-delay:0.5s;">✧</span>
    <span class="star" style="top:25%;left:5%;animation-delay:1s;">★</span>
    <span class="star" style="top:10%;left:50%;animation-delay:1.5s;">✦</span>
    <span class="star" style="top:30%;left:85%;animation-delay:0.3s;">✧</span>
    <span class="star" style="top:60%;left:8%;animation-delay:0.7s;">★</span>
    <span class="star" style="top:75%;left:90%;animation-delay:1.2s;">✦</span>
    <span class="star" style="top:85%;left:40%;animation-delay:0.8s;">✧</span>
    <span class="star" style="top:50%;left:95%;animation-delay:1.8s;">★</span>
    <span class="star" style="top:70%;left:20%;animation-delay:0.4s;">✦</span>
    <span class="star" style="top:40%;left:60%;animation-delay:1.1s;">✧</span>
    <span class="star" style="top:90%;left:70%;animation-delay:0.6s;">★</span>
  </div>

  <main class="game-container" role="main" aria-label="Lucky Slots Game">
    <h1>Lucky Slots</h1>

    <div class="stats-bar" role="status" aria-live="polite" aria-label="Game statistics">
      <div class="stat-item">
        <div class="stat-label">Credits</div>
        <div class="stat-value" id="credits" aria-label="Current credits">1000</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Wins</div>
        <div class="stat-value" id="wins" aria-label="Total wins">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Losses</div>
        <div class="stat-value" id="losses" aria-label="Total losses">0</div>
      </div>
    </div>

    <div class="reels-container" role="group" aria-label="Slot machine reels">
      <div class="reel" id="reel0" role="img" aria-label="Reel 1">🍒</div>
      <div class="reel" id="reel1" role="img" aria-label="Reel 2">🍒</div>
      <div class="reel" id="reel2" role="img" aria-label="Reel 3">🍒</div>
    </div>

    <div class="outcome-text" id="outcome" aria-live="assertive"></div>

    <button class="spin-btn" id="spinBtn" aria-label="Spin the reels, costs 100 credits">SPIN</button>
  </main>

  <div class="result-flash" id="resultFlash" aria-hidden="true"></div>

  <script>
    (function () {
      var symbols = ['🍒', '🍋', '🍊', '🍉', '🍇', '🍓', '🍈', '🍀', '🔔', '⭐', '❄️', '🌈'];
      var SPIN_COST = 100;
      var MATCH_2_PAYOUT = 300;
      var MATCH_3_PAYOUT = 1000;
      var SPIN_DURATION = 1500;
      var SPIN_INTERVAL = 100;
      var WIN_FREQUENCY = 440;
      var LOSS_FREQUENCY = 220;

      var credits = 1000;
      var wins = 0;
      var losses = 0;
      var isSpinning = false;
      var audioCtx = null;

      var creditsEl = document.getElementById('credits');
      var winsEl = document.getElementById('wins');
      var lossesEl = document.getElementById('losses');
      var reel0 = document.getElementById('reel0');
      var reel1 = document.getElementById('reel1');
      var reel2 = document.getElementById('reel2');
      var outcomeEl = document.getElementById('outcome');
      var spinBtn = document.getElementById('spinBtn');
      var resultFlash = document.getElementById('resultFlash');

      var reels = [reel0, reel1, reel2];

      function initAudio() {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch (e) {
          audioCtx = null;
        }
      }

      function playSound(frequency) {
        if (!audioCtx) return;
        try {
          var oscillator = audioCtx.createOscillator();
          var gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
          oscillator.start(audioCtx.currentTime);
          oscillator.stop(audioCtx.currentTime + 0.5);
        } catch (e) {
          // Silently fail if audio playback errors
        }
      }

      function randomSymbol() {
        return symbols[Math.floor(Math.random() * symbols.length)];
      }

      function updateUI() {
        creditsEl.textContent = credits;
        winsEl.textContent = wins;
        lossesEl.textContent = losses;
        spinBtn.disabled = credits < SPIN_COST;
        spinBtn.setAttribute('aria-label',
          credits < SPIN_COST
            ? 'Spin disabled - not enough credits'
            : 'Spin the reels, costs 100 credits'
        );
      }

      function clearReelClasses() {
        reels.forEach(function (reel) {
          reel.classList.remove('spinning', 'winner', 'loser');
        });
      }

      function showResultFlash(isWin) {
        resultFlash.className = 'result-flash';
        void resultFlash.offsetWidth;
        resultFlash.classList.add(isWin ? 'win-flash' : 'lose-flash');
        setTimeout(function () {
          resultFlash.className = 'result-flash';
        }, 600);
      }

      function evaluateResult(reelSymbols) {
        var s0 = reelSymbols[0];
        var s1 = reelSymbols[1];
        var s2 = reelSymbols[2];

        if (s0 === s1 && s1 === s2) {
          return { type: 'jackpot', multiplier: 3, payout: MATCH_3_PAYOUT };
        }
        if (s0 === s1 || s1 === s2 || s0 === s2) {
          return { type: 'win', multiplier: 2, payout: MATCH_2_PAYOUT };
        }
        return { type: 'loss', multiplier: 0, payout: 0 };
      }

      function spin() {
        if (isSpinning || credits < SPIN_COST) return;

        initAudio();

        credits -= SPIN_COST;
        updateUI();

        isSpinning = true;
        outcomeEl.textContent = '';
        outcomeEl.className = 'outcome-text';
        clearReelClasses();

        reels.forEach(function (reel) {
          reel.classList.add('spinning');
        });

        var elapsed = 0;
        var spinInterval = setInterval(function () {
          reels.forEach(function (reel) {
            reel.textContent = randomSymbol();
          });
          elapsed += SPIN_INTERVAL;
          if (elapsed >= SPIN_DURATION) {
            clearInterval(spinInterval);
            finishSpin();
          }
        }, SPIN_INTERVAL);
      }

      function finishSpin() {
        var finalSymbols = reels.map(function (reel) {
          return reel.textContent;
        });

        reels.forEach(function (reel) {
          reel.classList.remove('spinning');
        });

        var result = evaluateResult(finalSymbols);

        if (result.type === 'jackpot') {
          wins++;
          credits += result.payout;
          outcomeEl.textContent = 'JACKPOT! 🎉 +' + result.payout;
          outcomeEl.className = 'outcome-text win';
          reels.forEach(function (reel) {
            reel.classList.add('winner');
          });
          showResultFlash(true);
          playSound(WIN_FREQUENCY);
        } else if (result.type === 'win') {
          wins++;
          credits += result.payout;
          outcomeEl.textContent = 'Win! 🎊 +' + result.payout;
          outcomeEl.className = 'outcome-text win';
          var matchIdx = -1;
          if (finalSymbols[0] === finalSymbols[1]) matchIdx = 2;
          else if (finalSymbols[1] === finalSymbols[2]) matchIdx = 0;
          else if (finalSymbols[0] === finalSymbols[2]) matchIdx = 1;

          reels.forEach(function (reel, idx) {
            if (idx === matchIdx) {
              reel.classList.add('loser');
            } else {
              reel.classList.add('winner');
            }
          });
          showResultFlash(true);
          playSound(WIN_FREQUENCY);
        } else {
          losses++;
          outcomeEl.textContent = 'No match. Try again!';
          outcomeEl.className = 'outcome-text lose';
          reels.forEach(function (reel) {
            reel.classList.add('loser');
          });
          showResultFlash(false);
          playSound(LOSS_FREQUENCY);
        }

        isSpinning = false;
        updateUI();
      }

      spinBtn.addEventListener('click', spin);

      spinBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          spin();
        }
      });

      updateUI();
    })();
  </script>
</body>
</html>
